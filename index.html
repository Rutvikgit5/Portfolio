/* Layout concept: glass top bar, sticky section sidebar, one reading column. Zinc neutrals, violet accent, liquid-glass surfaces over a soft glow. */
:root {
  --bg: #09090b;
  --surface: #101012;
  --line: #27272a;
  --fg: #fafafa;
  --muted: #a1a1aa;
  --accent: #7f22fe;
  --accent-fg: #a77bff;
  --accent-ink: #ffffff;
  --good: #22c55e;
  --glass-top: rgba(255, 255, 255, 0.09);
  --glass-bot: rgba(255, 255, 255, 0.03);
  --glass-brd: rgba(255, 255, 255, 0.14);
  --glass-hi: rgba(255, 255, 255, 0.22);
  --glass-lo: rgba(0, 0, 0, 0.35);
  --glass-shadow: rgba(0, 0, 0, 0.45);
  --glass-bar: rgba(9, 9, 11, 0.55);
  --glow-a: rgba(127, 34, 254, 0.30);
  --glow-b: rgba(37, 99, 235, 0.18);
  --font-display: "Geist", "Segoe UI", system-ui, sans-serif;
  --font-body: "Geist", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  --hh: 60px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fafafa;
    --surface: #ffffff;
    --line: #e4e4e7;
    --fg: #09090b;
    --muted: #52525b;
    --accent: #7f22fe;
    --accent-fg: #7f22fe;
    --accent-ink: #ffffff;
    --good: #16a34a;
    --glass-top: rgba(255, 255, 255, 0.75);
    --glass-bot: rgba(255, 255, 255, 0.45);
    --glass-brd: rgba(9, 9, 11, 0.10);
    --glass-hi: rgba(255, 255, 255, 0.95);
    --glass-lo: rgba(9, 9, 11, 0.06);
    --glass-shadow: rgba(30, 20, 60, 0.14);
    --glass-bar: rgba(250, 250, 250, 0.6);
    --glow-a: rgba(127, 34, 254, 0.16);
    --glow-b: rgba(37, 99, 235, 0.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #fafafa;
  --surface: #ffffff;
  --line: #e4e4e7;
  --fg: #09090b;
  --muted: #52525b;
  --accent: #7f22fe;
  --accent-fg: #7f22fe;
  --accent-ink: #ffffff;
  --good: #16a34a;
  --glass-top: rgba(255, 255, 255, 0.75);
  --glass-bot: rgba(255, 255, 255, 0.45);
  --glass-brd: rgba(9, 9, 11, 0.10);
  --glass-hi: rgba(255, 255, 255, 0.95);
  --glass-lo: rgba(9, 9, 11, 0.06);
  --glass-shadow: rgba(30, 20, 60, 0.14);
  --glass-bar: rgba(250, 250, 250, 0.6);
  --glow-a: rgba(127, 34, 254, 0.16);
  --glow-b: rgba(37, 99, 235, 0.10);
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.65 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
main:focus { outline: none; }

.wrap {
  max-width: none; margin: 0;
  padding-left: max(32px, env(safe-area-inset-left, 0px));
  padding-right: max(32px, env(safe-area-inset-right, 0px));
}
@media (max-width: 860px) {
  .wrap {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
}

/* top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar { height: var(--hh); display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; }
.brand svg { color: var(--accent-fg); }
.toplinks { display: flex; gap: 18px; font-size: 0.95rem; color: var(--muted); }
.toplinks a { text-decoration: none; }
.toplinks a:hover { color: var(--fg); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.search {
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
  min-width: 260px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--muted); cursor: pointer; text-align: left;
}
.search:hover { border-color: var(--muted); }
kbd { font-family: var(--font-mono); font-size: 0.72rem; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
.clock {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line);
  border-radius: 999px; font-family: var(--font-mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.clock .tz { color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.icon-btn {
  width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line);
  background: var(--surface); border-radius: 8px; cursor: pointer; flex: none;
}
.icon-btn:hover { border-color: var(--muted); }

/* shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); align-items: start; }
.side {
  position: sticky; top: calc(var(--hh) + env(safe-area-inset-top, 0px));
  padding: 32px 20px 32px 0; border-right: 1px dashed var(--line); min-height: calc(100vh - var(--hh));
}
.side-h { margin: 0 0 14px; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; padding-left: 12px; }
#nav { display: flex; flex-direction: column; gap: 2px; }
#nav a { padding: 8px 12px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 500; }
#nav a:hover { color: var(--fg); }
#nav a[aria-current="page"] { background: var(--surface); color: var(--fg); border: 1px solid var(--line); padding: 7px 11px; }
main { min-width: 0; padding: 36px 0 72px 48px; }
main > .page { animation: rise 220ms ease-out; }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }

h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: -0.045em;
  font-size: clamp(2.2rem, 5.4vw, 3.5rem); line-height: 1.05; text-wrap: balance;
}
.sub {
  margin: 8px 0 28px; font-family: var(--font-display); font-weight: 600; letter-spacing: -0.04em;
  font-size: clamp(1.4rem, 3.4vw, 2.1rem); line-height: 1.15; color: var(--muted); text-wrap: balance;
}
h2 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.03em; font-size: 1.4rem; margin: 40px 0 14px; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 650; letter-spacing: -0.01em; font-size: 1.12rem; margin: 0; }
p { margin: 0 0 16px; }
.lede { max-width: 66ch; font-size: 1.1rem; }
.prose { max-width: 66ch; }
.fine { font-size: 0.85rem; color: var(--muted); }
.label { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 8px;
  border: 1px solid var(--line); background: transparent; text-decoration: none; font-weight: 600; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }

/* featured */
.feat { margin-top: 44px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.feat a { display: block; padding-top: 14px; border-top: 2px solid var(--line); text-decoration: none; }
.feat a:hover { border-top-color: var(--accent); }
.feat h3 { margin: 6px 0 6px; }
.feat p { color: var(--muted); font-size: 0.95rem; margin: 0; }

/* numbers */
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin: 36px 0 8px; }
.nums div { border-top: 2px solid var(--line); padding-top: 12px; }
.nums b { display: block; font-family: var(--font-display); font-size: 2.3rem; line-height: 1; letter-spacing: -0.03em; color: var(--accent-fg); font-variant-numeric: tabular-nums; }
.nums span { display: block; margin-top: 8px; font-size: 0.9rem; color: var(--muted); }

/* project cards */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card {
  display: flex; flex-direction: column; gap: 8px; padding: 20px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--surface); text-decoration: none; min-width: 0;
}
.card:hover { border-color: var(--accent); }
.card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
.card .kick { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); }
.card .more { margin-top: auto; padding-top: 8px; font-weight: 600; font-size: 0.92rem; color: var(--fg); }
.pill {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px;
  border: 1px solid var(--line); border-radius: 999px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted);
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.pill.live::before { background: var(--accent); }
.pill.done::before { background: var(--good); }

/* project detail */
.back { display: inline-block; margin-bottom: 18px; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--fg); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
ul.plain { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-family: var(--font-mono); font-size: 0.8rem; }
.callout { max-width: 66ch; margin-top: 24px; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--surface); font-size: 0.95rem; }
.callout b { display: block; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; font-weight: 500; }

/* skills */
.skillgrp { margin-bottom: 28px; }
.skillgrp h2 { margin-top: 28px; }
.skillgrp .fine { margin: -6px 0 12px; }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0 0 0 28px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 30px; margin-left: 8px; }
.tl > li { position: relative; }
.tl > li::before { content: ""; position: absolute; left: -35px; top: 7px; width: 13px; height: 13px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.tl .t { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.tl .when { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); margin: 2px 0 10px; }
.tag { padding: 1px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 0.72rem; font-weight: 600; }

/* interests */
.ints { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 32px; margin-top: 8px; }
.ints div { border-top: 2px solid var(--line); padding-top: 12px; }
.ints h3 { margin: 6px 0 4px; }
.ints p { margin: 0; color: var(--muted); }
.plane-btn { display: inline-flex; align-items: center; gap: 10px; margin-top: 14px; padding: 8px 18px 8px 10px; border-radius: 999px; border: 1px solid var(--glass-brd); cursor: pointer;
  background: linear-gradient(180deg, var(--glass-top), var(--glass-bot)); color: var(--fg); font-weight: 600; box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 24px -12px var(--glass-shadow); }
.plane-btn:hover { border-color: var(--muted); }
.plane-btn svg { width: 40px; height: 40px; animation: plane-bob 3.4s ease-in-out infinite; }
@keyframes plane-bob { 50% { transform: translate(3px, -4px) rotate(-5deg); } }
.plane-note { margin: 8px 0 0; font-size: 0.9rem; }
.bm-sky { position: fixed; inset: 0; z-index: 2000; overflow: hidden; pointer-events: auto; }
.bm-sky-bg { position: absolute; inset: 0; background: linear-gradient(180deg, #8fc7f2, #cfe9fb); opacity: 0; }
.bm-cloud { position: absolute; will-change: transform; filter: drop-shadow(0 6px 8px rgba(40, 90, 140, 0.25)); }
@media (prefers-reduced-motion: reduce) { .plane-btn svg { animation: none; } }
.gtr { position: relative; margin-top: 14px; padding: 10px 14px 10px 0; border-radius: 14px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer;
  background:
    radial-gradient(circle at 30% 50%, rgba(255, 255, 255, 0.22) 0 5px, transparent 6px),
    radial-gradient(circle at 70% 50%, rgba(255, 255, 255, 0.22) 0 5px, transparent 6px),
    repeating-linear-gradient(90deg, transparent 0 calc(20% - 3px), rgba(214, 200, 170, 0.5) calc(20% - 3px) 20%),
    linear-gradient(180deg, #3a2618, #24160d 55%, #1b100a);
  border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 10px 28px -12px rgba(0, 0, 0, 0.6); }
.gtr::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: linear-gradient(90deg, #efe6cf, #cdbf9c); }
.gtr-note { margin: 8px 0 0; }
.gs { display: flex; align-items: center; gap: 12px; width: 100%; height: 34px; padding: 0; border: 0; background: none; color: rgba(255, 255, 255, 0.7); font: inherit; cursor: pointer; }
.gs .gn { width: 14px; margin-left: 18px; font-family: var(--font-mono); font-size: 0.75rem; text-align: center; }
.gs i { display: block; flex: 1; height: var(--w); border-radius: 2px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.65); }
.gs i.plain { background: linear-gradient(180deg, #f4f4f4, #9b9b9b); }
.gs i.wound { background: repeating-linear-gradient(90deg, #dba964 0 2px, #8a5a2b 2px 4px); }
.gs:hover i { filter: brightness(1.25); }
.gs.on i { filter: brightness(1.5) drop-shadow(0 0 5px rgba(255, 215, 140, 0.9)); }
.gs:focus-visible { outline: 2px solid var(--accent-fg); outline-offset: -2px; border-radius: 6px; }
.films { list-style: none; margin: 16px 0 8px; padding: 0; border-top: 1px solid var(--line); max-width: 720px; }
.films li { display: flex; align-items: baseline; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.films .ft { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.films .fy { color: var(--muted); font-size: 0.9rem; }
.films .fr { font-family: var(--font-mono); color: var(--accent-fg); white-space: nowrap; }
.films .fd { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); white-space: nowrap; }

/* recent films as posters */
.posters { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; list-style: none; margin: 16px 0 10px; padding: 0; }
.posters a { display: block; color: inherit; text-decoration: none; }
.posters img, .posters .pf { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 10px; border: 1px solid var(--glass-brd); background: var(--surface); box-shadow: 0 10px 24px -14px var(--glass-shadow); transition: transform 200ms ease; text-align: center; padding: 8px; font-size: 0.85rem; color: var(--muted); }
.posters img { padding: 0; }
.posters a:hover img, .posters a:hover .pf { transform: translateY(-3px); }
.posters .pt { display: block; margin-top: 8px; font-size: 0.85rem; line-height: 1.3; overflow-wrap: anywhere; }
.posters .pt i { color: var(--muted); font-style: normal; }
.posters .pr { display: block; margin-top: 2px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent-fg); }
@media (max-width: 860px) { .posters { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
/* stats cards */
.scards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 18px 0 8px; }
.scard { border: 1px solid var(--glass-brd); border-radius: 16px; padding: 22px; text-align: center; background: linear-gradient(145deg, var(--glass-top), var(--glass-bot)); box-shadow: inset 0 1px 0 var(--glass-hi), 0 8px 28px -10px var(--glass-shadow); }
.scard .sv, .scard .sl { display: block; margin: 14px 0 8px; font-family: var(--font-display); font-size: 3rem; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.scard .sv { color: var(--accent-fg); }
.scard .sl { color: #ff2d6f; }
.scard p { margin: 0; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) { .scards { grid-template-columns: minmax(0, 1fr); } }

/* contact */
.rows { max-width: 560px; border-top: 1px solid var(--line); }
.rows .r { display: flex; align-items: center; gap: 16px; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.rows .v { font-family: var(--font-mono); font-size: 0.92rem; overflow-wrap: anywhere; user-select: all; }

/* pager */
.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 56px; font-weight: 600; }
.pager a { text-decoration: none; padding: 6px 0; }
.pager a:hover { color: var(--accent-fg); }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 0.88rem; }
footer .wrap { padding-block: 22px; text-align: center; }

/* palette */
#pal { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.55); display: grid; justify-items: center; align-items: start; padding: 12vh 16px 16px; }
#pal[hidden] { display: none; }
.panel { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4); }
.panel input { width: 100%; padding: 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; outline: none; }
#pal-list { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow-y: auto; }
#pal-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
#pal-list li[aria-selected="true"] { background: var(--bg); outline: 1px solid var(--line); }
#pal-list .k { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); align-self: center; }
.empty { padding: 16px; color: var(--muted); }

/* tablet and phone */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: calc(var(--hh) + env(safe-area-inset-top, 0px)); z-index: 15; padding: 8px 0; border-right: 0; border-bottom: 1px solid var(--line); min-height: 0; background: var(--bg); }
  .side-h { display: none; }
  #nav { flex-direction: row; overflow-x: auto; gap: 6px; scrollbar-width: none; }
  #nav a { white-space: nowrap; }
  main { padding: 28px 0 56px 0; }
  .toplinks { display: none; }
  .search { min-width: 0; }
  .search .s-text, .search kbd { display: none; }
  .clock .tz { display: none; }
  .feat { grid-template-columns: minmax(0, 1fr); }
  .nums { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards, .cols, .ints { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  main > .page { animation: none; }
}

/* liquid glass: translucent layers, blur, bright top edge, soft depth */
.glow {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60vmax 50vmax at 12% -8%, var(--glow-a), transparent 60%),
    radial-gradient(55vmax 45vmax at 95% 105%, var(--glow-b), transparent 60%);
}
.search, .clock, .icon-btn, .btn, .card, .callout, .chip, .pill, .panel, #nav a[aria-current="page"] {
  background: linear-gradient(145deg, var(--glass-top), var(--glass-bot));
  border-color: var(--glass-brd);
  -webkit-backdrop-filter: blur(18px) saturate(170%);

  var pal = $("#pal"), palIn = $("#pal-input"), palList = $("#pal-list"), palItems = [], palSel = 0, lastFocus = null;
  function drawPal() {
    var q = palIn.value.trim().toLowerCase();
    palItems = ITEMS.filter(function (x) { return !q || (x.label + " " + (x.extra || "") + " " + x.g).toLowerCase().indexOf(q) !== -1; });
    if (palSel >= palItems.length) palSel = 0;
    var html = "", g = "";
    palItems.forEach(function (x, i) {
      if (x.g !== g) { g = x.g; html += "<li class=\"grp\" role=\"presentation\">" + g + "</li>"; }
      html += "<li role=\"option\" data-i=\"" + i + "\" aria-selected=\"" + (i === palSel ? "true" : "false") + "\"><span class=\"ic\">" + svg(x.icon) + "</span><span>" + esc(x.label) + "</span></li>";
    });
    palList.innerHTML = html || "<li class=\"empty\">No matches</li>";
    var cur = palList.querySelector("[aria-selected=\"true\"]");
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
  }
  function openPal() { lastFocus = document.activeElement; pal.hidden = false; palIn.value = ""; palSel = 0; drawPal(); palIn.focus(); }
  function closePal() { pal.hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function go(i) {
    var x = palItems[i]; if (!x) return;
    closePal();
    if (x.hash) { navKind = "push"; location.hash = x.hash; }
    else if (x.theme) { setTheme(x.theme); }
    else if (x.href) {
      var a = document.createElement("a");
      a.href = x.href; a.target = "_blank"; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();
    }
  }

  pal.addEventListener("mousedown", function (e) { if (e.target === pal) closePal(); });
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); pal.hidden ? openPal() : closePal(); return; }
    if (pal.hidden) return;
    if (e.key === "Escape") { closePal(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(palSel + 1, palItems.length - 1); drawPal(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(palSel - 1, 0); drawPal(); }
    else if (e.key === "Enter") { e.preventDefault(); go(palSel); }
  });

  if (CONFIG.linkedin) { var li = $("#lnk-li"); li.href = CONFIG.linkedin; li.hidden = false; }
  if (CONFIG.resume) { var cv = $("#lnk-cv"); cv.href = CONFIG.resume; cv.hidden = false; }
  if (/Mac|iPhone|iPad/.test(navigator.platform || "")) $("#kbd").textContent = "⌘K";

  window.addEventListener("hashchange", function () {
    positions[lastKey] = window.scrollY;
    render();
    lastKey = routeKey();
    navKind = "pop";
  });
  render();
  lastKey = routeKey();

  /* live film diary (only when a feed endpoint is configured, e.g. on Vercel) */
  function loadFilms() {
    if (!CONFIG.filmsApi || !window.fetch) return;
    fetch(CONFIG.filmsApi).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.films || !j.films.length) return;
      FILMS = j.films;
      var y = window.scrollY;
      render();
      window.scrollTo(0, y);
    }).catch(function () {});
  }
  loadFilms();
  countVisit();
})();
</script>
</body>
</html>
